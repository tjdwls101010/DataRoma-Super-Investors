[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superinvestor"
version = "0.2.0"
description = "Python library & CLI for DataRoma — track what superinvestors buy and sell together"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Seongjin"}]
keywords = ["investing", "superinvestor", "13F", "hedge fund", "portfolio", "dataroma"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/tjdwls101010/superinvestor"
Repository = "https://github.com/tjdwls101010/superinvestor"
Issues = "https://github.com/tjdwls101010/superinvestor/issues"

[project.scripts]
superinvestor = "superinvestor.__main__:main"

[tool.setuptools.packages.find]
include = ["superinvestor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
